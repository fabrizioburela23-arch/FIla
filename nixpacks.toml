[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd backend && npm ci"]

[phases.build]
cmds = [
  "cd backend && npx prisma generate",
  "cd backend && npm run build",
  "cd backend && npx tsup prisma/seed.ts --out-dir dist --format cjs --no-splitting"
]

[start]
cmd = "cd backend && sh start.sh"
