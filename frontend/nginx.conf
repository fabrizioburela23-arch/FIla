server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and WebSocket requests to backend
        location /api/ {
                proxy_pass https://fila-production-3062.up.railway.app;
                proxy_set_header Host fila-production-3062.up.railway.app;
                proxy_ssl_server_name on;
    }
    
        location /socket.io/ {
                proxy_pass https://fila-production-3062.up.railway.app;
                proxy_set_header Host fila-production-3062.up.railway.app;
                proxy_ssl_server_name on;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
    }
    
        location /s/ {
                proxy_pass https://fila-production-3062.up.railway.app;
                proxy_set_header Host fila-production-3062.up.railway.app;
                proxy_ssl_server_name on;
    }
    
    # Serve React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
